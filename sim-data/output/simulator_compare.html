.diff b{font-size:18px}
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:12px}
.results{min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:16px}

.range label,.lim{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}

.cg{display:grid;gap:10px}
.cs{display:grid;grid-template-columns:1fr auto;font-size:13px;gap:2px 8px}
.cs input{grid-column:1/3}
.cs small{grid-column:1/3;color:var(--sub);font-size:11px;min-height:14px}
.rb,.cr button{font:inherit;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
.cr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.card .name{font-size:12px;color:var(--sub)}
.card .val{font-size:26px;font-weight:700;margin-top:4px}
.card .note{font-size:11px;color:var(--sub);margin-top:4px}
.card.yield{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:18px}
.card.yield .name,.card.yield .note{color:var(--accent-ink);opacity:.9}
.card.yield .val{font-size:56px}
.map{display:grid;gap:2px;margin-top:14px}
.chip{aspect-ratio:1;background:#9aa0aa;border-radius:2px;min-width:0}
.chip.pass{background:var(--ok)}.chip.fail{background:var(--bad)}.chip.off{opacity:.2}
.chip:hover{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
h3{font-size:13px;margin:16px 0 6px}
.bar{display:grid;grid-template-columns:104px 1fr 56px;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.bar .t{background:var(--line);border-radius:4px;height:14px;overflow:hidden}
.bar .t b{display:block;height:100%;border-radius:4px;background:var(--bad)}
.bar.z .t b{background:var(--ok)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.hist{position:relative;display:flex;align-items:flex-end;gap:2px;height:90px;border-bottom:1px solid var(--line)}
.hist .col{flex:1;border-radius:2px 2px 0 0;min-height:1px}
.hist .line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.hist .line em{position:absolute;top:-2px;left:4px;font-style:normal;font-size:10px;white-space:nowrap;background:var(--card);padding:0 3px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:3px}
.check{margin-top:12px;font-size:11px;color:var(--sub)}
#tip{position:fixed;z-index:10;pointer-events:none;display:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;max-width:240px}

  if(r[6]<P.idsat||r[7]<P.omin||r[7]>P.omax)return"parametric";
  return"none";
}
const WS=[{id:"W07",D:DATA.W07},{id:"W21",D:DATA.W21}];
const ALL=WS.flatMap(w=>w.D);
const maxR=Math.max(...ALL.map(r=>r[0]));
const HM=Math.max(Math.ceil(Math.max(...ALL.map(r=>r[3]))),12);
const sg=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v);
const $=id=>document.getElementById(id);
const tip=$("tip");

// ---- 화면 뼈대: 웨이퍼마다 카드 4개 + 맵 + 차트 ----
WS.forEach((w,i)=>{
  const box=document.createElement("section");box.className="panel";
  box.innerHTML='<h2 class="big">'+w.id+'</h2>'+
  '<div class="grid">'+
   '<div class="card yield"><div class="name">수율</div><div class="val" id="c1_'+i+'">-</div><div class="note" id="n1_'+i+'"></div></div>'+
   '<div class="card"><div class="name">검사 die 수</div><div class="val" id="c2_'+i+'">-</div><div class="note">반경 이내 die</div></div>'+
   '<div class="card"><div class="name">불량 수</div><div class="val" id="c3_'+i+'">-</div><div class="note" id="n3_'+i+'"></div></div>'+
   '<div class="card" style="grid-column:span 2"><div class="name">최다 불량 사유</div><div class="val" id="c4_'+i+'" style="font-size:20px">-</div><div class="note" id="n4_'+i+'"></div></div>'+
  '</div>'+
  '<div class="map" id="map_'+i+'"></div>'+
  '<div class="legend"><span><i style="background:var(--ok)"></i>합격</span><span><i style="background:var(--bad)"></i>불합격</span><span><i style="background:#9aa0aa;opacity:.3"></i>집계 범위 밖</span></div>'+
  '<h3>불합격 사유별 개수</h3><div id="rs_'+i+'"></div>'+
  '<h3>위치별 합격률</h3><div id="zs_'+i+'"></div>'+
  '<h3>누설전류(ioff) 분포 · 합격선</h3><div class="hist" id="hs_'+i+'"></div><div class="axis"><span>0 nA</span><span>'+HM+' nA</span></div>'+
  '<p class="check" id="ck_'+i+'"></p>';
  $("results").appendChild(box);
  const xs=w.D.map(r=>r[10]),ys=w.D.map(r=>r[11]),x0=Math.min(...xs),y0=Math.min(...ys),cols=Math.max(...xs)-x0+1;
  const map=$("map_"+i);map.style.gridTemplateColumns="repeat("+cols+",1fr)";
  w.chips=w.D.map((r,k)=>{const d=document.createElement("div");d.className="chip";
    d.style.gridColumn=r[10]-x0+1;d.style.gridRow=r[11]-y0+1;
    d.addEventListener("mouseenter",()=>{const j=w.J[k],bad=j!=="none";
      tip.innerHTML="<b>"+w.id+" · die ("+r[10]+", "+r[11]+")</b> · "+(bad?"불합격 — "+NAMES[j]:"합격")+
      "<br>중심에서 거리 "+r[0]+" mm<br>접촉저항 "+r[2]+" Ω · 누설전류 "+r[3]+" nA<br>문턱전압 "+r[4]+" V · 먼지 "+r[5]+"개<br>포화전류 "+r[6]+" mA · 산화막 "+r[7]+" nm"+(r[1]==1?"<br>깨짐·긁힘 있음":"");
      tip.style.display="block"});
    d.addEventListener("mousemove",e=>{tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14)+"px"});
    d.addEventListener("mouseleave",()=>{tip.style.display="none"});
    map.appendChild(d);return d});
});

// ---- 조절 바 8개 + 처음 값 ----
function rng(ci,step,floor0,def){
  const v=ALL.map(r=>r[ci]);let lo=Math.min(def,...v),hi=Math.max(def,...v);const pad=(hi-lo)*0.02;
  lo=Math.floor((lo-pad)/step)*step;hi=Math.ceil((hi+pad)/step)*step;if(floor0&&lo<0)lo=0;
  return [+lo.toFixed(4),+hi.toFixed(4)];
}
const SPECS=[
 ["rc","접촉저항 상한","Ω",2,0.5,true],["ioff","누설전류 상한","nA",3,0.1,true],
 ["vmin","문턱전압 하한","V",4,0.005,false],["vmax","문턱전압 상한","V",4,0.005,false],
 ["part","먼지 개수 상한","개",5,1,true],["idsat","포화전류 하한","mA",6,0.01,false],
 ["omin","산화막 두께 하한","nm",7,0.01,false],["omax","산화막 두께 상한","nm",7,0.01,false]
].map(s=>{const [lo,hi]=rng(s[3],s[4],s[5],DEFV[s[0]]);return {k:s[0],name:s[1],unit:s[2],step:s[4],lo,hi}});
$("ctl").innerHTML='<h2>합격 기준 조절 (기준표 값에서 시작)</h2><div class="cg">'+
 SPECS.map(s=>'<div class="cs"><span>'+s.name+'</span><b><span id="cv_'+s.k+'"></span> <button class="rb" type="button" data-k="'+s.k+'">처음 값</button></b>'+
 '<input type="range" aria-label="'+s.name+'" id="cr_'+s.k+'" min="'+s.lo+'" max="'+s.hi+'" step="'+s.step+'"><small id="cd_'+s.k+'"></small></div>').join("")+
 '</div><div class="cr"><label><input type="checkbox" id="ck" checked> 깨짐·긁힘이면 불량</label><button id="rs" type="button">모두 처음 값으로</button></div>';
SPECS.forEach(s=>$("cr_"+s.k).addEventListener("input",e=>{P[s.k]=+e.target.value;render()}));
document.querySelectorAll(".rb").forEach(b=>b.addEventListener("click",()=>{P[b.dataset.k]=DEFV[b.dataset.k];render()}));
$("ck").addEventListener("change",e=>{P.crack=e.target.checked;render()});
$("rs").addEventListener("click",()=>{Object.assign(P,DEFV,{crack:true});render()});
const s=$("r");s.max=maxR;s.value=maxR;s.addEventListener("input",render);

function bars(id,entries,unit,cls){
  const mx=Math.max(1,...entries.map(e=>e[1]));
  $(id).innerHTML=entries.length?entries.map(([k,v,txt])=>'<div class="bar '+(cls||"")+'"><span>'+k+'</span><span class="t"><b style="width:'+(cls?v:v/mx*100)+'%"></b></span><span class="n">'+txt+'</span></div>').join(""):"불합격 없음";
}
function render(){
  const lim=+s.value;
  $("rv").textContent=(+lim.toFixed(1))+" mm"+(lim>=maxR?" (모두 집계)":"");
  SPECS.forEach(sp=>{const v=P[sp.k],d0=DEFV[sp.k],df=+(v-d0).toFixed(3);
    $("cr_"+sp.k).value=v;$("cv_"+sp.k).textContent=(+v.toFixed(3))+" "+sp.unit;
    $("cd_"+sp.k).textContent=df===0?"처음 값과 같음 ("+d0+" "+sp.unit+")":"처음 값 "+d0+" "+sp.unit+" 대비 "+sg(df)});
  $("ck").checked=P.crack;
  const ys=[];
  WS.forEach((w,i)=>{
    w.J=w.D.map(judge);
    let n=0,f=0,of=0;const rc={},oc={},z={center:[0,0],mid:[0,0],edge:[0,0]},B=24,bw=HM/B,hc=new Array(B).fill(0);
    w.D.forEach((r,k)=>{
      w.chips[k].className="chip "+(w.J[k]==="none"?"pass":"fail")+(r[0]>lim?" off":"");
      if(r[0]>lim)return;n++;const j=w.J[k];
      if(j!=="none"){f++;rc[j]=(rc[j]||0)+1}
      if(r[8]==="FAIL"){of++;oc[r[9]]=(oc[r[9]]||0)+1}
      const g=z[r[12]]||(z[r[12]]=[0,0]);g[0]++;if(j==="none")g[1]++;
      hc[Math.min(B-1,Math.floor(r[3]/bw))]++;
    });
    const y=n?(n-f)/n*100:null;ys.push(y);
    $("c1_"+i).textContent=n?y.toFixed(1)+"%":"–";
    $("n1_"+i).textContent=n?"합격 "+(n-f)+" / "+n+" · 원본 "+((n-of)/n*100).toFixed(1)+"% 대비 "+sg(+(((of-f)/n*100).toFixed(1)))+"%p":"집계할 die 없음";
    $("c2_"+i).textContent=n;$("c3_"+i).textContent=f;
    $("n3_"+i).textContent="FAIL · 원본 "+of+" 대비 "+sg(f-of);
    const rs=Object.entries(rc).sort((a,b)=>b[1]-a[1]),ot=Object.entries(oc).sort((a,b)=>b[1]-a[1])[0];
    $("c4_"+i).textContent=rs.length?NAMES[rs[0][0]]:"없음";
    $("n4_"+i).textContent=(rs.length?rs[0][0]+" · "+rs[0][1]+"건":"")+" · 원본: "+(ot?NAMES[ot[0]]+" "+ot[1]+"건":"없음");
    bars("rs_"+i,rs.map(([k,v])=>[NAMES[k],v,v+"건"]));
    bars("zs_"+i,Object.keys(z).map(k=>{const [a,b]=z[k],p=a?b/a*100:0;return [(ZN[k]||k)+" ("+a+")",p,a?p.toFixed(1)+"%":"–"]}),"","z");
    const mx=Math.max(1,...hc);
    $("hs_"+i).innerHTML=hc.map((v,q)=>'<div class="col" title="'+(q*bw).toFixed(1)+'~'+((q+1)*bw).toFixed(1)+' nA: '+v+'개" style="height:'+v/mx*100+'%;background:var('+((q+0.5)*bw<=P.ioff?'--ok':'--bad')+')"></div>').join("")+
      '<div class="line" style="left:'+P.ioff/HM*100+'%"><em>합격선 '+P.ioff+' nA</em></div>';
    const m=w.D.filter((r,k)=>(w.J[k]==="none"?"PASS":"FAIL")===r[8]&&w.J[k]===r[9]).length;
    $("ck_"+i).textContent="재판정 검증: 엑셀 pass_fail·fail_type과 "+m+"/"+w.D.length+"줄 일치"+(m===w.D.length?"":" (기준을 바꾸면 달라질 수 있음)");
  });
  $("diff").innerHTML=ys[0]==null||ys[1]==null?"집계할 die 없음":
    "수율 차이 (W21 − W07): <b>"+sg(+(ys[1]-ys[0]).toFixed(1))+"%p</b> · W07 "+ys[0].toFixed(1)+"% → W21 "+ys[1].toFixed(1)+"%";
}
render();
</script>
</body>
</html>
