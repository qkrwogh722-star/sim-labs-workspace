<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨이퍼 비교 시뮬레이터</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8;
    --pass: #2f6fdb; --fail: #d93b3b; --wafer: #eef1f5; --accent: #3b5bdb; --bar: #d93b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2e3440;
            --pass: #5b8ff0; --fail: #f06262; --wafer: #232831; --accent: #7c95f0; --bar: #f06262; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .files { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .files label { display: block; font-weight: 600; margin-bottom: 4px; }
  .files input { width: 100%; }
  .err { color: var(--fail); font-size: 13px; min-height: 1em; }
  #libwarn { display: none; color: var(--fail); font-weight: 600; }

  .rules { width: 100%; border-collapse: collapse; }
  .rules th, .rules td { border-bottom: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: middle; }
  .rules th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .rules td.ord { width: 36px; text-align: center; font-weight: 700; }
  .rules .ctl { display: flex; align-items: center; gap: 8px; margin: 2px 0; flex-wrap: wrap; }
  .rules .ctl span.k { width: 34px; color: var(--muted); font-size: 12px; }
  .rules input[type=range] { flex: 1 1 140px; min-width: 100px; accent-color: var(--accent); }
  .rules input[type=number] { width: 84px; padding: 2px 4px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  .rules .def { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .rules .changed { color: var(--accent); font-weight: 700; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }

  .wafers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel, .wafers > * { min-width: 0; }
  .wafer h2 { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
  .wafer h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--bg); border-radius: 8px; padding: 8px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .kpi.pass .v { color: var(--pass); } .kpi.fail .v { color: var(--fail); }
  .match { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .match.bad { color: var(--fail); font-weight: 600; }
  svg.map { width: 100%; height: auto; display: block; max-width: 460px; margin: 0 auto; }
  svg.map rect.die { stroke: var(--panel); stroke-width: 0.8; cursor: pointer; }
  svg.map rect.die:hover { stroke: var(--text); stroke-width: 1.6; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .bars h3 { font-size: 13px; margin: 8px 0 4px; }
  svg.bars text { fill: var(--text); font-size: 11px; }
  svg.bars text.n { font-variant-numeric: tabular-nums; }
  #tip { position: fixed; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line);
         border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; z-index: 10; max-width: 260px; }
  #tip b.p { color: var(--pass); } #tip b.f { color: var(--fail); }
  #tip table { border-collapse: collapse; margin-top: 4px; }
  #tip td { padding: 0 6px 0 0; } #tip td.x { color: var(--fail); font-weight: 700; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }

  @media (max-width: 760px) {
    .files, .wafers { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    /* 좁은 화면: 기준표 한 줄을 세로로 쌓는다 (순서·항목·사유 → 슬라이더) */
    .rules thead { display: none; }
    .rules, .rules tbody, .rules tr, .rules td { display: block; width: auto; }
    .rules tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    .rules td { border: 0; padding: 0; }
    .rules td.ord, .rules td.name { display: inline; width: auto; }
    .rules td.ord::after { content: '.'; }
    .rules td:last-child { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .rules td:last-child br { display: none; }
    .rules td:last-child .def::before { content: ' · '; }
    .rules .def { white-space: normal; }
    .rules input[type=range] { flex-basis: 100%; }
  }
</style>
</head>
<body>
<main>
  <h1>웨이퍼 비교 시뮬레이터</h1>
  <p class="sub">두 웨이퍼를 불러와 나란히 놓고, 합격 기준값을 바꿔 가며 맵·불량률·불량 사유가 어떻게 달라지는지 봅니다.</p>

  <section class="panel">
    <h2>1. 웨이퍼 파일 열기</h2>
    <p id="libwarn">엑셀 읽기 라이브러리(SheetJS)를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로 고침하세요.</p>
    <div class="files">
      <div><label for="f0">왼쪽 웨이퍼 (예: wafer_test_W07.xlsx)</label><input type="file" id="f0" accept=".xlsx"><div class="err" id="e0"></div></div>
      <div><label for="f1">오른쪽 웨이퍼 (예: wafer_test_W21.xlsx)</label><input type="file" id="f1" accept=".xlsx"><div class="err" id="e1"></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h2 style="margin:0">2. 합격 기준 (합격기준표 순서)</h2>
      <button id="reset" type="button">기본값으로 되돌리기</button>
    </div>
    <table class="rules">
      <thead><tr><th>순서</th><th class="name">항목</th><th>합격 조건</th><th>걸리면 사유</th></tr></thead>
      <tbody id="rulebody"></tbody>
    </table>
  </section>

  <section class="wafers">
    <div class="panel wafer" id="w0"></div>
    <div class="panel wafer" id="w1"></div>
  </section>

  <footer>기준표 순서대로 확인해 처음 걸린 사유 하나로 판정합니다(first-match-wins). 순서 6의 포화전류·산화막 두께는 같은 순위로, 어느 쪽이 벗어나도 parametric입니다.</footer>
</main>
<div id="tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  'use strict';

  // ---- 합격기준표 (sim-data/templates/합격기준표.md) -------------------------
  // 각 기준값: key, 열, 종류(max: 이하 / min: 이상), 기본값, 슬라이더 step
  var LIMITS = {
    rc_max:    { col: 'rc_ohm',       kind: 'max', def: 15,   step: 0.01 },
    ioff_max:  { col: 'ioff_na',      kind: 'max', def: 10,   step: 0.01 },
    vth_min:   { col: 'vth_v',        kind: 'min', def: 0.38, step: 0.001 },
    vth_max:   { col: 'vth_v',        kind: 'max', def: 0.52, step: 0.001 },
    part_max:  { col: 'particle_cnt', kind: 'max', def: 4,    step: 1 },
    idsat_min: { col: 'idsat_ma',     kind: 'min', def: 0.92, step: 0.001 },
    ox_min:    { col: 'ox_thk_nm',    kind: 'min', def: 2.85, step: 0.001 },
    ox_max:    { col: 'ox_thk_nm',    kind: 'max', def: 3.15, step: 0.001 }
  };
  var RULES = [
    { ord: 1, cols: ['crack'],            name: '깨짐·긁힘',            unit: '0/1', reason: 'crack',      rname: '깨짐·긁힘',
      limits: [], fixed: '0 (1이면 걸림)', fails: function (d) { return d.crack !== 0; } },
    { ord: 2, cols: ['rc_ohm'],           name: '접촉저항',             unit: 'Ω',  reason: 'open_short', rname: '접촉저항 초과',
      limits: ['rc_max'], fails: function (d, t) { return d.rc_ohm > t.rc_max; } },
    { ord: 3, cols: ['ioff_na'],          name: '누설전류',             unit: 'nA', reason: 'leakage',    rname: '누설전류 초과',
      limits: ['ioff_max'], fails: function (d, t) { return d.ioff_na > t.ioff_max; } },
    { ord: 4, cols: ['vth_v'],            name: '문턱전압',             unit: 'V',  reason: 'vth_shift',  rname: '문턱전압 범위 밖',
      limits: ['vth_min', 'vth_max'], fails: function (d, t) { return d.vth_v < t.vth_min || d.vth_v > t.vth_max; } },
    { ord: 5, cols: ['particle_cnt'],     name: '먼지 개수',            unit: '개', reason: 'particle',   rname: '먼지 많음',
      limits: ['part_max'], fails: function (d, t) { return d.particle_cnt > t.part_max; } },
    { ord: 6, cols: ['idsat_ma', 'ox_thk_nm'], name: '포화전류 · 산화막 두께', unit: 'mA · nm', reason: 'parametric', rname: '기타 측정값',
      limits: ['idsat_min', 'ox_min', 'ox_max'],
      fails: function (d, t) { return d.idsat_ma < t.idsat_min || d.ox_thk_nm < t.ox_min || d.ox_thk_nm > t.ox_max; } }
  ];
  var NUM_COLS = ['die_x', 'die_y', 'center_x_mm', 'center_y_mm', 'radius_mm', 'crack', 'rc_ohm', 'ioff_na', 'vth_v', 'particle_cnt', 'idsat_ma', 'ox_thk_nm'];
  var REQUIRED = NUM_COLS.concat(['pass_fail', 'fail_type', 'wafer_id']);
  var LABEL = { rc_max: '이하', ioff_max: '이하', vth_min: '이상', vth_max: '이하', part_max: '이하', idsat_min: '이상', ox_min: '이상', ox_max: '이하' };
  var LIMIT_TITLE = { rc_max: 'rc_ohm', ioff_max: 'ioff_na', vth_min: 'vth_v', vth_max: 'vth_v', part_max: 'particle_cnt', idsat_min: 'idsat_ma', ox_min: 'ox_thk_nm', ox_max: 'ox_thk_nm' };

  // 데이터의 부동소수 오차(예: 9.779999999999999)가 경계값 비교를 흔들지 않도록 소수 6자리로 맞춘다.
  function r6(v) { return Math.round(v * 1e6) / 1e6; }

  var thr = {};
  Object.keys(LIMITS).forEach(function (k) { thr[k] = LIMITS[k].def; });
  var wafers = [null, null];

  function judge(d) {
    for (var i = 0; i < RULES.length; i++) {
      if (RULES[i].fails(d, thr)) return RULES[i].reason;
    }
    return 'none';
  }

  // ---- 기준값 패널 ----------------------------------------------------------
  var inputs = {};
  function buildRules() {
    var tb = document.getElementById('rulebody');
    tb.innerHTML = '';
    RULES.forEach(function (r) {
      var tr = document.createElement('tr');
      var ctl = '';
      if (!r.limits.length) {
        ctl = '<div class="ctl">' + r.cols[0] + ' = ' + r.fixed + ' <span class="def">(고정)</span></div>';
      } else {
        r.limits.forEach(function (k) {
          var L = LIMITS[k];
          ctl += '<div class="ctl"><span class="k">' + LABEL[k] + '</span>' +
                 '<input type="range" id="s_' + k + '" step="' + L.step + '" aria-label="' + LIMIT_TITLE[k] + ' ' + LABEL[k] + '">' +
                 '<input type="number" id="n_' + k + '" step="' + L.step + '" aria-label="' + LIMIT_TITLE[k] + ' ' + LABEL[k] + ' 값">' +
                 '<span class="def" id="d_' + k + '">' + LIMIT_TITLE[k] + ' · 기본 ' + L.def + '</span></div>';
        });
      }
      tr.innerHTML = '<td class="ord">' + r.ord + '</td>' +
        '<td class="name">' + r.name + ' <span class="def">(' + r.unit + ')</span></td>' +
        '<td>' + ctl + '</td>' +
        '<td>' + r.reason + '<br><span class="def">' + r.rname + '</span></td>';
      tb.appendChild(tr);
    });
    Object.keys(LIMITS).forEach(function (k) {
      var s = document.getElementById('s_' + k), n = document.getElementById('n_' + k);
      inputs[k] = { s: s, n: n, d: document.getElementById('d_' + k) };
      s.addEventListener('input', function () { setThr(k, parseFloat(s.value)); });
      n.addEventListener('change', function () { var v = parseFloat(n.value); if (!isNaN(v)) setThr(k, v); });
    });
    setRanges();
  }

  function setRanges() {
    Object.keys(LIMITS).forEach(function (k) {
      var L = LIMITS[k], lo = L.def, hi = L.def;
      wafers.forEach(function (w) {
        if (!w) return;
        w.rows.forEach(function (d) { var v = d[L.col]; if (v < lo) lo = v; if (v > hi) hi = v; });
      });
      if (lo === hi) { lo = L.def * 0.5; hi = L.def * 1.5; }
      var pad = (hi - lo) * 0.02;
      // 슬라이더 값은 min + k*step 으로만 움직이므로, min/max를 step 배수에 맞춰야 10 같은 값이 정확히 10이 된다.
      lo = r6(Math.floor((lo - pad) / L.step) * L.step);
      hi = r6(Math.ceil((hi + pad) / L.step) * L.step);
      if (L.step >= 1 && lo < 0) lo = 0;
      ['s', 'n'].forEach(function (x) { inputs[k][x].min = lo; inputs[k][x].max = hi; });
      syncInputs(k);
    });
  }

  function syncInputs(k) {
    inputs[k].s.value = thr[k];
    inputs[k].n.value = thr[k];
    inputs[k].d.classList.toggle('changed', thr[k] !== LIMITS[k].def);
  }

  function setThr(k, v) {
    thr[k] = r6(Math.round(v / LIMITS[k].step) * LIMITS[k].step);
    syncInputs(k);
    renderAll();
  }

  document.getElementById('reset').addEventListener('click', function () {
    Object.keys(LIMITS).forEach(function (k) { thr[k] = LIMITS[k].def; syncInputs(k); });
    renderAll();
  });

  // ---- 파일 읽기 -------------------------------------------------------------
  function loadFile(slot, file) {
    var err = document.getElementById('e' + slot);
    err.textContent = '';
    if (typeof XLSX === 'undefined') { err.textContent = 'SheetJS가 없어 파일을 읽을 수 없습니다.'; return; }
    var fr = new FileReader();
    fr.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var raw = XLSX.utils.sheet_to_json(ws, { defval: null });
        if (!raw.length) throw new Error('데이터 행이 없습니다.');
        var missing = REQUIRED.filter(function (c) { return !(c in raw[0]); });
        if (missing.length) throw new Error('웨이퍼 파일이 아닙니다. 없는 열: ' + missing.join(', '));
        var rows = raw.map(function (o) {
          var d = { zone: o.zone, pass_fail: String(o.pass_fail), fail_type: String(o.fail_type) };
          NUM_COLS.forEach(function (c) { d[c] = r6(Number(o[c])); });
          return d;
        });
        var bad = rows.filter(function (d) { return NUM_COLS.some(function (c) { return isNaN(d[c]); }); }).length;
        if (bad) throw new Error('숫자가 아닌 측정값이 ' + bad + '행 있습니다.');
        wafers[slot] = { name: file.name, id: String(raw[0].wafer_id), lot: raw[0].lot_id, rows: rows };
        setRanges();
        renderAll();
      } catch (ex) {
        wafers[slot] = null;
        err.textContent = ex.message;
        renderAll();
      }
    };
    fr.readAsArrayBuffer(file);
  }
  [0, 1].forEach(function (slot) {
    document.getElementById('f' + slot).addEventListener('change', function (e) {
      if (e.target.files[0]) loadFile(slot, e.target.files[0]);
    });
  });

  // ---- 그리기 ---------------------------------------------------------------
  var SVGNS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    for (var a in attrs) n.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function fmt(v, dp) { return Number(v).toFixed(dp); }

  function renderAll() {
    var results = wafers.map(function (w) {
      if (!w) return null;
      var counts = {}; RULES.forEach(function (r) { counts[r.reason] = 0; });
      var pass = 0, match = 0;
      var judged = w.rows.map(function (d) {
        var reason = judge(d);
        if (reason === 'none') pass++; else counts[reason]++;
        if ((reason === 'none' ? 'PASS' : 'FAIL') === d.pass_fail) match++;
        return reason;
      });
      return { judged: judged, counts: counts, pass: pass, fail: w.rows.length - pass, match: match };
    });
    // 두 웨이퍼 막대그래프를 같은 눈금으로 그려 크기를 바로 비교할 수 있게 한다.
    var barMax = 1;
    results.forEach(function (r) { if (r) RULES.forEach(function (x) { barMax = Math.max(barMax, r.counts[x.reason]); }); });
    [0, 1].forEach(function (i) { renderWafer(i, wafers[i], results[i], barMax); });
  }

  function renderWafer(i, w, res, barMax) {
    var box = document.getElementById('w' + i);
    box.innerHTML = '';
    var h = document.createElement('h2');
    if (!w) {
      h.textContent = (i === 0 ? '왼쪽' : '오른쪽') + ' 웨이퍼';
      box.appendChild(h);
      var em = document.createElement('div'); em.className = 'empty';
      em.textContent = '위에서 웨이퍼 엑셀 파일을 선택하세요.';
      box.appendChild(em);
      return;
    }
    h.innerHTML = w.id + ' <small>' + w.name + ' · ' + (w.lot || '') + '</small>';
    box.appendChild(h);

    var n = w.rows.length;
    var k = document.createElement('div'); k.className = 'kpis';
    k.innerHTML =
      '<div class="kpi"><div class="v">' + n + '</div><div class="l">전체 die</div></div>' +
      '<div class="kpi pass"><div class="v">' + res.pass + '</div><div class="l">PASS</div></div>' +
      '<div class="kpi fail"><div class="v">' + res.fail + '</div><div class="l">FAIL</div></div>' +
      '<div class="kpi fail"><div class="v">' + fmt(res.fail * 100 / n, 2) + '%</div><div class="l">불량률</div></div>';
    box.appendChild(k);

    var m = document.createElement('div');
    m.className = 'match' + (res.match === n ? '' : ' bad');
    m.textContent = '파일에 저장된 판정(pass_fail)과 일치: ' + res.match + ' / ' + n +
      (res.match === n ? '' : '  (기준값을 바꾸면 달라질 수 있음)');
    box.appendChild(m);

    // 웨이퍼 맵: center_x_mm / center_y_mm 기준, die 간격 10 mm
    var R = 150, pitch = 10, size = pitch * 0.94;
    var svg = el('svg', { 'class': 'map', viewBox: (-R - 6) + ' ' + (-R - 6) + ' ' + (2 * R + 12) + ' ' + (2 * R + 12), role: 'img',
      'aria-label': w.id + ' 웨이퍼 맵, PASS ' + res.pass + ', FAIL ' + res.fail });
    el('circle', { cx: 0, cy: 0, r: R, fill: 'var(--wafer)', stroke: 'var(--line)', 'stroke-width': 1.5 }, svg);
    el('path', { d: 'M -14 ' + R + ' L 14 ' + R, stroke: 'var(--bg)', 'stroke-width': 4 }, svg); // notch
    w.rows.forEach(function (d, j) {
      var reason = res.judged[j];
      var rc = el('rect', {
        'class': 'die', x: d.center_x_mm - size / 2, y: -d.center_y_mm - size / 2, width: size, height: size, rx: 1.2,
        fill: reason === 'none' ? 'var(--pass)' : 'var(--fail)'
      }, svg);
      rc.addEventListener('mousemove', function (ev) { showTip(ev, w, d, reason); });
      rc.addEventListener('mouseleave', hideTip);
      rc.addEventListener('click', function (ev) { showTip(ev, w, d, reason); ev.stopPropagation(); });
    });
    box.appendChild(svg);

    var lg = document.createElement('div'); lg.className = 'legend';
    lg.innerHTML = '<span><i style="background:var(--pass)"></i>PASS</span><span><i style="background:var(--fail)"></i>FAIL</span>';
    box.appendChild(lg);

    // 사유별 막대그래프
    var bars = document.createElement('div'); bars.className = 'bars';
    bars.innerHTML = '<h3>불량 사유별 die 수</h3>';
    var W = 440, rowH = 24, labelW = 190, numW = 34;
    var bs = el('svg', { 'class': 'bars', viewBox: '0 0 ' + W + ' ' + (RULES.length * rowH + 4), width: '100%', role: 'img',
      'aria-label': '불량 사유별 die 수' });
    RULES.forEach(function (r, idx) {
      var y = idx * rowH + 2, c = res.counts[r.reason];
      var bw = (W - labelW - numW - 6) * c / barMax;
      var t = el('text', { x: 0, y: y + 15 }, bs); t.textContent = r.ord + '. ' + r.reason + ' (' + r.rname + ')';
      el('rect', { x: labelW, y: y + 4, width: Math.max(bw, c ? 2 : 0), height: rowH - 9, rx: 2, fill: 'var(--bar)' }, bs);
      var tn = el('text', { 'class': 'n', x: labelW + bw + 4, y: y + 15 }, bs); tn.textContent = c;
    });
    bars.appendChild(bs);
    box.appendChild(bars);
  }

  // ---- 툴팁 -----------------------------------------------------------------
  var tip = document.getElementById('tip');
  function showTip(ev, w, d, reason) {
    var rule = RULES.filter(function (r) { return r.reason === reason; })[0];
    var rows = [
      ['crack', d.crack, 'crack'], ['rc_ohm', fmt(d.rc_ohm, 2), 'open_short'], ['ioff_na', fmt(d.ioff_na, 2), 'leakage'],
      ['vth_v', fmt(d.vth_v, 3), 'vth_shift'], ['particle_cnt', d.particle_cnt, 'particle'],
      ['idsat_ma', fmt(d.idsat_ma, 3), 'parametric'], ['ox_thk_nm', fmt(d.ox_thk_nm, 3), 'parametric']
    ];
    var html = '<div><b>' + w.id + '</b> die (' + d.die_x + ', ' + d.die_y + ') · ' + (d.zone || '') + ' · r=' + fmt(d.radius_mm, 1) + 'mm</div>' +
      '<div>판정: ' + (reason === 'none' ? '<b class="p">PASS</b>' : '<b class="f">FAIL</b> — ' + reason + ' (' + rule.rname + ')') + '</div><table>';
    // 판정 사유가 된 규칙에서 실제로 기준을 벗어난 값만 강조한다 (순서 6은 두 열 중 벗어난 쪽만).
    var out = {
      crack: d.crack !== 0, rc_ohm: d.rc_ohm > thr.rc_max, ioff_na: d.ioff_na > thr.ioff_max,
      vth_v: d.vth_v < thr.vth_min || d.vth_v > thr.vth_max, particle_cnt: d.particle_cnt > thr.part_max,
      idsat_ma: d.idsat_ma < thr.idsat_min, ox_thk_nm: d.ox_thk_nm < thr.ox_min || d.ox_thk_nm > thr.ox_max
    };
    rows.forEach(function (x) {
      html += '<tr><td>' + x[0] + '</td><td' + (x[2] === reason && out[x[0]] ? ' class="x"' : '') + '>' + x[1] + '</td></tr>';
    });
    html += '</table><div style="color:var(--muted);margin-top:4px">파일 판정: ' + d.pass_fail + ' / ' + d.fail_type + '</div>';
    tip.innerHTML = html;
    tip.style.display = 'block';
    var tw = tip.offsetWidth, th = tip.offsetHeight;
    var x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + tw > window.innerWidth - 8) x = ev.clientX - tw - 14;
    if (y + th > window.innerHeight - 8) y = ev.clientY - th - 14;
    tip.style.left = Math.max(8, x) + 'px';
    tip.style.top = Math.max(8, y) + 'px';
  }
  function hideTip() { tip.style.display = 'none'; }
  document.addEventListener('click', hideTip);

  // ---- 시작 -----------------------------------------------------------------
  if (typeof XLSX === 'undefined') document.getElementById('libwarn').style.display = 'block';
  buildRules();
  renderAll();
})();
</script>
</body>
</html>
