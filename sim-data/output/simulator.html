<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨이퍼 W07 카드</title>
<style>
:root{--ok:#1f9d55;--bad:#d92d20;--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#667085;--line:#e3e6ec;--accent:#ff7a00;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171f;--card:#1e222d;--ink:#eef0f5;--sub:#9aa3b5;--line:#2c3140;--accent:#ff8a1f;--accent-ink:#1a1100}}
:root[data-theme="dark"]{--bg:#14171f;--card:#1e222d;--ink:#eef0f5;--sub:#9aa3b5;--line:#2c3140;--accent:#ff8a1f;--accent-ink:#1a1100}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",system-ui,sans-serif}
.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:12px}
.results{min-width:0}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}}
.cs small{grid-column:1/3;color:var(--sub);font-size:11px;min-height:14px}
.rb{font:inherit;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
main{max-width:1240px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}
.meta{color:var(--sub);font-size:13px;margin:0 0 20px}
.range{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.range label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.range input{width:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card .name{font-size:13px;color:var(--sub)}
.card .val{font-size:32px;font-weight:700;margin-top:6px}
.card .note{font-size:12px;color:var(--sub);margin-top:4px}
.card.yield{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding:24px}
.card.yield .name,.card.yield .note{color:var(--accent-ink);opacity:.85}
.card.yield .val{font-size:72px}
.map{display:grid;gap:2px;margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{aspect-ratio:1;background:#9aa0aa;border-radius:2px;min-width:0}
.chip.pass{background:var(--ok)}
.chip.fail{background:var(--bad)}
.chip.off{opacity:.2}
.chip:hover{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.split{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px;align-items:start}
.split .map{margin-top:0}
.charts{display:grid;grid-template-columns:1fr;gap:12px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{font-size:14px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:110px 1fr 64px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bar .t{background:var(--line);border-radius:4px;height:16px;overflow:hidden}
.bar .t b{display:block;height:100%;border-radius:4px;background:var(--bad)}
.bar.z .t b{background:var(--ok)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.cg{display:grid;grid-template-columns:1fr;gap:10px}
.cs{display:grid;grid-template-columns:1fr auto;font-size:13px;gap:2px 8px}
.cs input{grid-column:1/3;width:100%}
.cr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px}
.cr button{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
@media (max-width:640px){.cg{grid-template-columns:1fr}}
.lim{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.hist{position:relative;display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:10px;border-bottom:1px solid var(--line)}
.hist .col{flex:1;border-radius:2px 2px 0 0;min-height:1px}
.hist .line{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.hist .line em{position:absolute;top:-2px;left:4px;font-style:normal;font-size:11px;white-space:nowrap;color:var(--ink);background:var(--card);padding:0 3px}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:10;pointer-events:none;display:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;max-width:240px}
.check{margin-top:16px;font-size:12px;color:var(--sub)}
@media (max-width:640px){.grid{grid-template-columns:1fr}.card.yield{grid-column:auto}.card.yield .val{font-size:56px}}
</style>
</head>

</div>
</div></div>

    "<br>포화전류 "+r[6]+" mA · 산화막 "+r[7]+" nm"+(r[1]==1?"<br>깨짐·긁힘 있음":"");
}
const chips=D.map((r,i)=>{const d=document.createElement("div");d.className="chip "+(J[i]==="none"?"pass":"fail");
  d.style.gridColumn=r[10]-x0+1;d.style.gridRow=r[11]-y0+1;

const _render=render;
const ZN={center:"중앙",mid:"중간",edge:"가장자리"};
function bars(lim){
  const rc={},z={center:[0,0],mid:[0,0],edge:[0,0]};
  D.forEach((r,i)=>{if(r[0]>lim)return;const g=z[r[12]]||(z[r[12]]=[0,0]);g[0]++;if(J[i]==="none")g[1]++;else rc[J[i]]=(rc[J[i]]||0)+1});
  const rs=Object.entries(rc).sort((a,b)=>b[1]-a[1]),mx=rs.length?rs[0][1]:1;
  document.getElementById("reasons").innerHTML=rs.length?rs.map(([k,v])=>
    '<div class="bar"><span>'+NAMES[k]+'</span><span class="t"><b style="width:'+v/mx*100+'%"></b></span><span class="n">'+v+'건</span></div>').join(""):"불합격 없음";
  document.getElementById("zones").innerHTML=Object.keys(z).map(k=>{const [n,p]=z[k],pct=n?p/n*100:0;
    return '<div class="bar z"><span>'+(ZN[k]||k)+' ('+n+')</span><span class="t"><b style="width:'+pct+'%"></b></span><span class="n">'+(n?pct.toFixed(1)+"%":"–")+'</span></div>'}).join("");
}
const baseCheck=document.getElementById("check").textContent;
const il=document.getElementById("il"),HM=Math.max(Math.ceil(Math.max(...D.map(r=>r[3]))),12);
il.min=0;il.max=HM;il.step=0.1;il.value=IOFF;
document.getElementById("imax").textContent=HM+" nA";
il.addEventListener("input",()=>{IOFF=+il.value;render()});
const DEFV={rc:15,ioff:10,vmin:0.38,vmax:0.52,part:4,idsat:0.92,omin:2.85,omax:3.15};
const sg=v=>(v>0?"+":v<0?"−":"±")+Math.abs(v);
// 원본(엑셀 pass_fail, fail_type) 대비 차이를 카드 설명에 덧붙임
function deltas(){
  const lim=+s.value;let n=0,f=0,of=0;const oc={};
  D.forEach((r,i)=>{if(r[0]>lim)return;n++;if(J[i]!=="none")f++;if(r[8]==="FAIL"){of++;oc[r[9]]=(oc[r[9]]||0)+1}});
  if(n){const dy=+(((n-f)-(n-of))/n*100).toFixed(1);
    document.getElementById("n1").textContent+=" · 원본 "+((n-of)/n*100).toFixed(1)+"% 대비 "+sg(dy)+"%p"}
  document.getElementById("n3").textContent="FAIL · 원본 "+of+" 대비 "+sg(f-of);
  const ot=Object.entries(oc).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("n4").textContent+=" · 원본: "+(ot?NAMES[ot[0]]+" "+ot[1]+"건":"없음");
}
// 합격 기준 조절 바 8개 (합격기준표 행 기준)
const SPECS=[
 ["rc","접촉저항 상한","Ω",0,26,0.5,()=>P.rc,v=>{P.rc=v}],
 ["ioff","누설전류 상한","nA",0,HM,0.1,()=>IOFF,v=>{IOFF=v}],
 ["vmin","문턱전압 하한","V",0.35,0.6,0.005,()=>P.vmin,v=>{P.vmin=v}],
 ["vmax","문턱전압 상한","V",0.35,0.6,0.005,()=>P.vmax,v=>{P.vmax=v}],
 ["part","먼지 개수 상한","개",0,12,1,()=>P.part,v=>{P.part=v}],
 ["idsat","포화전류 하한","mA",0.8,1.2,0.01,()=>P.idsat,v=>{P.idsat=v}],
 ["omin","산화막 두께 하한","nm",2.75,3.25,0.01,()=>P.omin,v=>{P.omin=v}],
 ["omax","산화막 두께 상한","nm",2.75,3.25,0.01,()=>P.omax,v=>{P.omax=v}]
];
const ctl=document.getElementById("ctl");
ctl.innerHTML='<h2 style="font-size:14px;margin:0 0 12px">합격 기준 조절 (기준표 값에서 시작)</h2><div class="cg">'+
 SPECS.map(s=>'<div class="cs"><span>'+s[1]+'</span><b><span id="cv_'+s[0]+'"></span> <button class="rb" type="button" data-k="'+s[0]+'" title="처음 값으로">처음 값</button></b><input type="range" aria-label="'+s[1]+'" id="cr_'+s[0]+'" min="'+s[3]+'" max="'+s[4]+'" step="'+s[5]+'"><small id="cd_'+s[0]+'"></small></div>').join("")+
 '</div><div class="cr"><label><input type="checkbox" id="ck" checked> 깨짐·긁힘이면 불량</label><button id="rs" type="button">기준표 값으로 되돌리기</button></div>';
SPECS.forEach(s=>document.getElementById("cr_"+s[0]).addEventListener("input",e=>{s[7](+e.target.value);render()}));
ctl.querySelectorAll(".rb").forEach(b=>b.addEventListener("click",()=>{const s=SPECS.find(x=>x[0]===b.dataset.k);s[7](DEFV[s[0]]);render()}));

function syncCtl(){
  SPECS.forEach(s=>{const v=s[6](),d0=DEFV[s[0]],df=+(v-d0).toFixed(3);
    document.getElementById("cr_"+s[0]).value=v;document.getElementById("cv_"+s[0]).textContent=(+v.toFixed(3))+" "+s[2];
    document.getElementById("cd_"+s[0]).textContent=df===0?"처음 값과 같음 ("+d0+" "+s[2]+")":"처음 값 "+d0+" "+s[2]+" 대비 "+(df>0?"+":"−")+Math.abs(df)});
  document.getElementById("ck").checked=P.crack;il.value=IOFF;
}
function hist(lim){
  const B=24,w=HM/B,c=new Array(B).fill(0);
  D.forEach(r=>{if(r[0]<=lim)c[Math.min(B-1,Math.floor(r[3]/w))]++});
  const mx=Math.max(1,...c);
  document.getElementById("hist").innerHTML=c.map((v,i)=>'<div class="col" title="'+(i*w).toFixed(1)+'~'+((i+1)*w).toFixed(1)+' nA: '+v+'개" style="height:'+v/mx*100+'%;background:var('+((i+0.5)*w<=IOFF?'--ok':'--bad')+')"></div>').join("")+
    '<div class="line" style="left:'+IOFF/HM*100+'%"><em>합격선 '+IOFF+' nA</em></div>';
  document.getElementById("iv").textContent=IOFF+" nA";
}
render=function(){J=D.map(judge);_render();syncCtl();deltas();const lim=+s.value;bars(lim);hist(lim);
  chips.forEach((d,i)=>{d.classList.toggle("pass",J[i]==="none");d.classList.toggle("fail",J[i]!=="none")});
  document.getElementById("check").textContent=(JSON.stringify(P)+"|"+IOFF)===DEF?baseCheck:"합격 기준을 바꿔 다시 계산 중 (엑셀 판정과 다를 수 있음)";D.forEach((r,i)=>chips[i].classList.toggle("off",r[0]>lim))};
s.addEventListener("input",render);render();

// ---- 엑셀(.xlsx) / CSV 올리기: 파싱 후 이 페이지를 새 데이터로 다시 불러옴 ----
const NEED=["radius_mm","crack","rc_ohm","ioff_na","vth_v","particle_cnt","idsat_ma","ox_thk_nm","die_x","die_y","zone"];
function judgeDef(r){
  if(r[1]==1)return"crack";if(r[2]>15)return"open_short";if(r[3]>10)return"leakage";
  if(r[4]<0.38||r[4]>0.52)return"vth_shift";if(r[5]>4)return"particle";
  if(r[6]<0.92||r[7]<2.85||r[7]>3.15)return"parametric";return"none";
}
function parseCSV(t){
  t=t.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
async function readZip(buf){
  const v=new DataView(buf),u=new Uint8Array(buf),dec=new TextDecoder();
  let e=u.length-22;while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("xlsx(zip) 형식이 아닙니다");
  const cnt=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const files={};
  for(let i=0;i<cnt;i++){
    const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
    files[dec.decode(u.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+el+cl;
  }
  async function get(name){
    const f=files[name];if(!f)return null;
    const ln=v.getUint16(f.lo+26,true),le=v.getUint16(f.lo+28,true),st=f.lo+30+ln+le;
    const raw=u.subarray(st,st+f.cs);
    if(f.m===0)return dec.decode(raw);
    const ds=new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return dec.decode(await new Response(ds).arrayBuffer());
  }
  return {files,get};
}
function colIdx(ref){let n=0;for(const ch of ref.replace(/\d+/g,""))n=n*26+ch.charCodeAt(0)-64;return n-1}
async function readXlsx(buf){
  const z=await readZip(buf);
  const sx=await z.get("xl/sharedStrings.xml");let sst=[];
  if(sx){const d=new DOMParser().parseFromString(sx,"application/xml");
    sst=[...d.getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join(""))}
  const name=Object.keys(z.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!name)throw new Error("시트를 찾지 못했습니다");
  const d=new DOMParser().parseFromString(await z.get(name),"application/xml");
  return [...d.getElementsByTagName("row")].map(r=>{const a=[];
    [...r.getElementsByTagName("c")].forEach(c=>{
      const i=colIdx(c.getAttribute("r")||"A1"),t=c.getAttribute("t");let val;
      if(t==="inlineStr")val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");
      else{const ve=c.getElementsByTagName("v")[0];val=ve?ve.textContent:"";if(t==="s")val=sst[+val]}
      a[i]=val});
    return a});
}
function toData(rows){
  const h=(rows[0]||[]).map(x=>String(x==null?"":x).trim());
  const miss=NEED.filter(k=>!h.includes(k));
  if(miss.length)throw new Error("웨이퍼 열이 없습니다: "+miss.join(", "));
  const ix={};h.forEach((k,i)=>ix[k]=i);
  const hasJ=h.includes("pass_fail")&&h.includes("fail_type"),out=[];
  rows.slice(1).forEach(r=>{
    if(!r||r[ix.radius_mm]===undefined||r[ix.radius_mm]==="")return;
    const n=k=>parseFloat(r[ix[k]]);
    const row=[n("radius_mm"),n("crack"),n("rc_ohm"),n("ioff_na"),n("vth_v"),n("particle_cnt"),n("idsat_ma"),n("ox_thk_nm"),null,null,n("die_x"),n("die_y"),String(r[ix.zone])];
    if(row.slice(0,8).concat(row[10],row[11]).some(Number.isNaN))throw new Error((out.length+2)+"번째 데이터 줄에 숫자가 아닌 값이 있습니다");
    if(hasJ){row[8]=String(r[ix.pass_fail]).trim();row[9]=String(r[ix.fail_type]).trim()}
    out.push(row)});
  if(!out.length)throw new Error("데이터 줄이 없습니다");
  if(!hasJ)out.forEach(r=>{const t=judgeDef(r);r[8]=t==="none"?"PASS":"FAIL";r[9]=t});
  return {out,hasJ};
}
document.getElementById("fi").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;const msg=document.getElementById("fmsg");msg.textContent="읽는 중…";
  try{
    const rows=/\.csv$/i.test(f.name)?parseCSV(await f.text()):await readXlsx(await f.arrayBuffer());
    const {out,hasJ}=toData(rows);
    sessionStorage.setItem("uploadD",JSON.stringify(out));
    sessionStorage.setItem("uploadName",f.name+(hasJ?"":" (판정 열 없음)"));
    location.reload();
  }catch(err){msg.textContent="올리지 못했습니다: "+err.message}
});
document.getElementById("orig").addEventListener("click",()=>{try{sessionStorage.removeItem("uploadD");sessionStorage.removeItem("uploadName")}catch(e){}location.reload()});
